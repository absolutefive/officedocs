[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officedocs"
version = "0.1.0"
description = "텍스트(마크다운) 문서로부터 편집 가능한 PPTX를 자동 생성하는 도구"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
officedocs = "officedocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
